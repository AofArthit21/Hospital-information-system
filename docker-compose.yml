services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agnos
      POSTGRES_USER: agnos
      POSTGRES_PASSWORD: agnos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnos -d agnos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://agnos:agnos@postgres:5432/agnos?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456}
      JWT_TTL: 8h
      HIS_TIMEOUT: 5s
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
